<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://webstepdev.com/demo/syncoWebsiteImages/sss-logo-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brazilian-inspired football coaching for boys and girls aged 4–12 across London and the UK. Building ball mastery, confidence, and flair." />
    <title>Samba Soccer Schools | Bring Back The Beautiful Game</title>
    <!-- Google Fonts: Gasoek One & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans overflow-x-clip">
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      // Patch Node.prototype to prevent Google Translate from crashing React on insertBefore/removeChild
      if (typeof Node === 'function' && Node.prototype) {
        const origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return origInsertBefore.call(this, newNode, null);
          }
          return origInsertBefore.apply(this, arguments);
        };
        const origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child && child.parentNode !== this) {
            if (child.parentNode) return child.parentNode.removeChild(child);
            return child;
          }
          return origRemoveChild.apply(this, arguments);
        };
      }

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,ar,pt,fr,es,ro,pl,bn',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
